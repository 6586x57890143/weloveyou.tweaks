// 26.x ships unobfuscated, so this uses Loom's non-remapping plugin, Mojang's
// own names and Java 25. Built now so the edge channel has it on day one.
plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

base { archivesName = "weloveyou-tweaks-26.2" }

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.161.0+26.2"
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
