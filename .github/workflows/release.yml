name: release

# Tag-driven: `git tag v0.1.1 && git push origin v0.1.1` builds a jar per
# Minecraft version and attaches both to a GitHub release, which is where the
# pack's packwiz metadata points.
#
# No third-party actions outside actions/*, same rule as the rest of the
# project: this workflow can write releases. Gradle is downloaded and checked
# against its published sha256 instead of a setup action, and no wrapper jar
# is committed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: "9.8.1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: install gradle
        run: |
          set -euo pipefail
          url="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -sSfL -o gradle.zip "$url"
          echo "$(curl -sSfL "$url.sha256")  gradle.zip" | sha256sum -c -
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: build
        run: >
          gradle build --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-download=false
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mc-*/build/libs/*.jar --title "$GITHUB_REF_NAME" --notes "Tool and armour durability x2, for Minecraft 1.21.1 and 26.2."
