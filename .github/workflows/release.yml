
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: "9.8.1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          url="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -sSfL -o gradle.zip "$url"
          echo "$(curl -sSfL "$url.sha256")  gradle.zip" | sha256sum -c -
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          gradle build --no-daemon \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Porg.gradle.java.installations.auto-download=false

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(mc-*/build/libs/*-*.jar)

          if [[ ${#assets[@]} -ne 2 ]]; then
            printf 'Expected 2 JARs, found %s:\n' "${#assets[@]}"
            printf '  %s\n' "${assets[@]}"
            exit 1
          fi

          printf 'Publishing these JARs:\n'
          printf '  %s\n' "${assets[@]}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Tool and armour durability x2, for Minecraft 1.21.1 and 26.2."
          else
            gh release create "$GITHUB_REF_NAME" \
              "${assets[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes "Tool and armour durability x2, for Minecraft 1.21.1 and 26.2."
          fi
